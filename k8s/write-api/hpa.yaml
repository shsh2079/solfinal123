apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: write-api-hpa
  namespace: ticketing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: write-api-burst
  # find_threshold 실측 결과: write-api 안전 최대 102.5 RPS
  # pod당 처리량 ~20 RPS → 102 / 20 = 5대 필요 + 버퍼 5 = 10대
  # stable 1대 + burst 최대 9대 = 합계 10대
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 45
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 90
