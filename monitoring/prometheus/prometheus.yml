global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod
    region: ap-northeast-2

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: monitoring-ec2

  - job_name: cloudwatch-exporter
    static_configs:
      - targets: ["cloudwatch-exporter.ticketing.svc.cluster.local:9106"]
    scrape_interval: 60s

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter.ticketing.svc.cluster.local:9121"]

  - job_name: read-api
    metrics_path: /metrics
    static_configs:
      - targets: ["read-api.ticketing.svc.cluster.local:5000"]

  - job_name: write-api
    metrics_path: /metrics
    static_configs:
      - targets: ["write-api.ticketing.svc.cluster.local:5001"]

  - job_name: worker-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-svc.ticketing.svc.cluster.local:5002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
